name: release

# 打一个 v* 标签并 push，就会自动：跑一遍校验 → 打市场包 → 建 GitHub Release → 附上 zip
#
#   git tag v0.44.0
#   git push origin v0.44.0
#
# 也可以在 Actions 页面手动触发（workflow_dispatch），填版本号即可。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（与 package.json 一致，例如 0.44.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 校验（类型 + 测试 + 自描述 + 面板 + 产物新鲜度）
        run: npm run verify

      - name: 打市场包
        run: npm run pack:release
        env:
          # pack.mjs 默认输出到仓库的上一级；CI 里指到 dist-release 便于上传
          RELEASE_DIR: ${{ github.workspace }}\dist-release

      - name: 读取版本
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=cortico-world-telegram-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时用输入值，否则用 tag 名
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: cortico-world-telegram ${{ steps.meta.outputs.version }}
          body: |
            对应 npm 包 `cortico-world-telegram@${{ steps.meta.outputs.version }}`。

            安装方式：
            - 市场里搜 Telegram（走 npm 分发）
            - 或直接用本页附件里的 zip 覆盖安装
          files: dist-release/${{ steps.meta.outputs.zip }}
          fail_on_unmatched_files: true
